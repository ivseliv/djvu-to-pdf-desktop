name: Build docs

on:
  push:
    branches:
      - 'master'

jobs:
  docs:
    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@v6
    - name: Install prerequisites on Ubuntu
      run: |
        sudo apt update
        sudo apt install --yes libdjvulibre21 libdjvulibre-dev groff

    - name: Setup uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --frozen --group docs --no-default-groups

    - name: Build docs
      run: uv run --no-sync --module src.helpers.docs_cli build-dynamic-docs

    - name: Save generated manual
      uses: actions/upload-artifact@v4
      with:
        name: dpsprep-manual
        path: docs/dpsprep.1.md
        if-no-files-found: error
