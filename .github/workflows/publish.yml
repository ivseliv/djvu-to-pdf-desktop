name: Publish

# This fork publishes desktop application releases on GitHub.  Keep the
# inherited upstream PyPI workflow manual so a desktop release tag can never
# overwrite or impersonate the original dpsprep package.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on:  ubuntu-slim

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Install prerequisites on Ubuntu
      run: |
        sudo apt update
        sudo apt install --yes djvulibre-bin qpdf

    - name: Setup uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Build
      run: uv build

    - name: Test source distribution
      run: uv run --isolated --with dist/*.tar.gz pytest

    - name: Test wheel distribution
      run: uv run --isolated --with dist/*.whl pytest

    - name: Publish
      run: uv publish
